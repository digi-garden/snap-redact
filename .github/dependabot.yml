# 設計：docs/05-devenv-cicd.md 5.2、docs/04-security-design.md 6章
# 更新の PR も CI（成果物の検査を含む）を通ってからマージする。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint が対応するまで TypeScript のメジャー更新は受けない（S1 で確認：8.73 は <6.1.0）
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node は実行環境の Node（.nvmrc の 24 LTS）に合わせる。Node の LTS を上げるときに手で上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # 開発用の依存は1つの PR にまとめる
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # 実行時の依存（react / react-dom）は一緒に上げる
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
